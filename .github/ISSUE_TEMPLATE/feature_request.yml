name: Feature request
description: Suggest a new feature or an improvement to Vireo.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the workflow problem first so we can understand the goal before locking in a specific design.

  - type: dropdown
    id: area
    attributes:
      label: Which part of Vireo is this about?
      options:
        - Live diff viewer
        - Code editor
        - Agent Chat (built-in)
        - CLI Agent integration
        - Integrated terminal
        - Git / Commit Graph / Checkpoints
        - Quick Open / Workspace Search
        - vx CLI tools
        - Themes / UI
        - Packaging / CLI flags
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
      placeholder: When I ... I have to ..., which is slow because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe how you picture it working in Vireo.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other tools, workarounds, or approaches, and why they fall short.

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Links, screenshots, or mock-ups.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been suggested.
          required: true
