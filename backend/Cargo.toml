[package]
name = "vireo"
version = "0.2.0"
edition = "2021"
default-run = "vireo"

[[bin]]
name = "vireo"
path = "src/main.rs"

[[bin]]
name = "vx"
path = "src/bin/vx/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "fs", "sync", "time", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
notify = "7"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tokio-stream = "0.1"
rust-embed = "8"
mime_guess = "2"
rfd = "0.15"
url = "2"
regex = "1"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-json = "0.24.8"
xxhash-rust = { version = "0.8.21", features = ["xxh32"] }
# In-process structural search/rewrite over the grammars above (replaces a 55 MB ast-grep.exe).
ast-grep-core = { version = "0.51.1", default-features = false, features = ["tree-sitter"] }
ignore = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# CI smoke-test builds: release semantics (optimized, no debug assertions, GUI subsystem)
# without fat LTO / single codegen unit, which dominate build time. Shipped builds use `release`.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
