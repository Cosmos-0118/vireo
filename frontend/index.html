<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Vireo</title>
    <script src="/api/prefs/bootstrap.js"></script>
  </head>
  <body style="margin:0;height:100vh;background:var(--bg-base,#1b1c1f);color:var(--text-primary,#e4e7ee);overflow:hidden">
    <div id="root" style="height:100%;width:100%;display:flex;flex-direction:column">
      <div style="height:44px;background:var(--bg-sidebar,#16171a);border-bottom:1px solid var(--border,#2a2d35);flex-shrink:0"></div>
      <div style="flex:1;display:flex;min-height:0">
        <div style="width:48px;background:var(--bg-activity,#111215);border-right:1px solid var(--border,#2a2d35);flex-shrink:0"></div>
        <div style="width:272px;background:var(--bg-sidebar,#16171a);border-right:1px solid var(--border,#2a2d35);flex-shrink:0"></div>
        <div style="flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-base,#1b1c1f)">
          <div style="flex:1"></div>
          <div style="height:240px;background:var(--bg-panel,#141518);border-top:1px solid var(--border,#2a2d35);flex-shrink:0"></div>
        </div>
      </div>
      <div style="height:24px;background:var(--status-bar-bg,#111215);border-top:1px solid var(--border,#2a2d35);flex-shrink:0"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
